<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>จอ QR ลงเวลา</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0f1a14; color: #f3f6f4; font-family: 'IBM Plex Sans Thai', sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.2vmin; padding: 3vmin; text-align: center; }
  .name { font-size: 4.2vmin; font-weight: 700; }
  .clock { font-size: 9vmin; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .date { font-size: 3vmin; opacity: .75; }
  .card { background: #fff; padding: 3vmin; border-radius: 3vmin; box-shadow: 0 2vmin 6vmin rgba(0,0,0,.35); }
  #qr { width: 58vmin; height: 58vmin; }
  #qr img, #qr canvas { width: 100% !important; height: 100% !important; image-rendering: pixelated; }
  .bar { width: 64vmin; height: 1.4vmin; background: rgba(255,255,255,.15); border-radius: 1vmin; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: #2fbf71; width: 100%; transition: width .25s linear; }
  .hint { font-size: 3.2vmin; line-height: 1.5; max-width: 80vmin; }
  .hint b { color: #7fe0a8; }
  .warn { background: #b3261e; color: #fff; padding: 1.5vmin 3vmin; border-radius: 2vmin; font-size: 3vmin; display: none; }
  #start { position: fixed; inset: 0; background: rgba(15,26,20,.92); display: none; align-items: center; justify-content: center; font-size: 4vmin; cursor: pointer; }
  #pair { display: none; }
  #pair input { font: inherit; font-size: 7vmin; letter-spacing: 1.5vmin; text-align: center; width: 60vmin; padding: 2vmin; border-radius: 2vmin; border: 0; }
  #pair button { font: inherit; font-size: 4vmin; font-weight: 700; padding: 2vmin 6vmin; border-radius: 2vmin; border: 0; background: #2fbf71; color: #0f1a14; margin-top: 3vmin; cursor: pointer; }
  #pairmsg { min-height: 5vmin; font-size: 3.2vmin; color: #ffb4ab; margin-top: 2vmin; }
  .foot { position: fixed; bottom: 1.5vmin; right: 2vmin; font-size: 2vmin; opacity: .35; }
</style>
</head>
<body>
<div class="wrap" id="run" style="display:none">
  <div class="name" id="name"></div>
  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date"></div>
  <div class="card"><div id="qr"></div></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="hint">เปิด <b>LINE</b> → กดเมนู <b>ลงเวลา</b> → ตรวจตำแหน่ง ถ่ายเซลฟี่ → กด <b>สแกน QR และบันทึก</b> แล้วสแกนรหัสนี้</div>
  <div class="warn" id="warn"></div>
</div>

<div class="wrap" id="pair">
  <div class="name">จอ QR ลงเวลา</div>
  <div style="font-size:4vmin">จับคู่แท็บเล็ตนี้ (ทำครั้งเดียว)</div>
  <div style="font-size:3vmin;opacity:.8;max-width:80vmin">ผู้ดูแล: ในชีตเลือกเมนู ระบบลงเวลา → 4) จับคู่จอ QR แล้วใส่รหัส 6 หลักที่ได้</div>
  <input id="code" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="000000">
  <button id="pairbtn">จับคู่</button>
  <div id="pairmsg"></div>
</div>
<div id="start">แตะหน้าจอเพื่อเริ่มแสดง QR</div>
<div class="foot" id="foot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ═══ ตั้งค่า: URL เดียวกับ API_URL ใน index.html ═══ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyHX9e_m07Z6MHcHntd9ZuHgwXQaRKj62sujFOITuDkNdOrJjE-xexwkMB2YVcl8m8Kgw/exec';
/* ════════════════════════════════════════════════ */

const KEY = 'btb_kiosk_token_v1';
const $ = id => document.getElementById(id);
const TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_D = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
let offset = 0, tokens = [], liffId = '', stepSec = 30, lastShown = '', qr = null, fails = 0;
let kioskIp = '', ipAt = 0, running = false;

function store(v) { try { if (v === null) localStorage.removeItem(KEY); else localStorage.setItem(KEY, v); return true; } catch (e) { return false; } }
function load() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
function showWarn(t) { $('warn').textContent = t; $('warn').style.display = t ? 'block' : 'none'; }
async function api(body) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) }); // text/plain: ไม่ต้อง preflight
  return r.json();
}
// ขอให้เบราว์เซอร์เก็บข้อมูลถาวร ไม่ลบเองตอนพื้นที่เต็ม
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

/* ── จับคู่ ── */
function showPair(msg) {
  $('run').style.display = 'none'; $('start').style.display = 'none';
  $('pair').style.display = 'flex'; $('pairmsg').textContent = msg || '';
}
$('pairbtn').addEventListener('click', async () => {
  const code = $('code').value.trim();
  if (!/^\d{6}$/.test(code)) { $('pairmsg').textContent = 'ใส่รหัส 6 หลัก'; return; }
  $('pairbtn').disabled = true; $('pairmsg').textContent = 'กำลังจับคู่…';
  try {
    const r = await api({ action: 'kioskPair', code, name: navigator.userAgent.slice(0, 40) });
    if (!r.ok) { $('pairmsg').textContent = r.message || 'จับคู่ไม่สำเร็จ'; return; }
    if (!store(r.token) || load() !== r.token) { $('pairmsg').textContent = 'เบราว์เซอร์นี้เก็บข้อมูลไม่ได้ (ห้ามใช้โหมดไม่ระบุตัวตน) ใช้ Chrome แล้วลองใหม่'; return; }
    startRun();
  } catch (e) {
    $('pairmsg').textContent = 'เชื่อมต่อไม่ได้ ตรวจ Wi-Fi';
  } finally { $('pairbtn').disabled = false; }
});

/* ── แสดง QR ── */
function refreshIp() {
  if (Date.now() - ipAt < 5 * 60000) return;
  ipAt = Date.now();
  fetch('https://api.ipify.org?format=json').then(r => r.json()).then(j => { kioskIp = j.ip; }).catch(() => {});
}
async function fetchTokens() {
  refreshIp();
  const tok = load();
  if (!tok) return showPair();
  const t0 = Date.now();
  try {
    const r = await api({ action: 'kioskTokens', token: tok, ip: kioskIp });
    if (!r.ok) { store(null); return showPair('จอนี้ถูกยกเลิกการจับคู่แล้ว ขอรหัสใหม่จากผู้ดูแล'); }
    fails = 0;
    offset = r.now - (t0 + Date.now()) / 2;
    tokens = r.tokens; liffId = r.liffId; stepSec = r.stepSec;
    $('name').textContent = r.stationName;
    showWarn(liffId ? '' : 'ยังไม่ได้ใส่ LIFF ID ในระบบ');
    $('foot').textContent = kioskIp ? 'IP ' + kioskIp : '';
  } catch (e) {
    if (++fails >= 2) showWarn('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจ Wi-Fi');
  }
}

function tick() {
  const n = Date.now() + offset;
  const th = new Date(n + 7 * 3600000);
  const p = v => String(v).padStart(2, '0');
  $('clock').textContent = p(th.getUTCHours()) + ':' + p(th.getUTCMinutes()) + ':' + p(th.getUTCSeconds());
  $('date').textContent = 'วัน' + TH_D[th.getUTCDay()] + ' ' + th.getUTCDate() + ' ' + TH_M[th.getUTCMonth()] + ' ' + (th.getUTCFullYear() + 543);
  const stepMs = stepSec * 1000, step = Math.floor(n / stepMs);
  $('bar').style.width = (100 - ((n % stepMs) / stepMs) * 100) + '%';
  const cur = tokens.find(t => t.step === step);
  if (!cur) { $('qr').style.opacity = tokens.length ? .15 : 1; return; }
  $('qr').style.opacity = 1;
  const text = 'https://liff.line.me/' + liffId + '?k=' + cur.token;
  if (text === lastShown) return;
  lastShown = text;
  if (!qr) qr = new QRCode($('qr'), { text: text, width: 512, height: 512, correctLevel: QRCode.CorrectLevel.M });
  else { qr.clear(); qr.makeCode(text); }
}

async function wake() {
  try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch (e) {}
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch (e) {}
}
$('start').addEventListener('click', () => { $('start').style.display = 'none'; wake(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && running) { wake(); fetchTokens(); } });

function startRun() {
  $('pair').style.display = 'none'; $('run').style.display = 'flex'; $('start').style.display = 'flex';
  if (running) return;
  running = true;
  fetchTokens(); setInterval(fetchTokens, 60 * 1000);   // ขอ QR ล่วงหน้า 4 รอบ ทุก 1 นาที
  tick(); setInterval(tick, 250);
  setTimeout(() => location.reload(), 6 * 3600 * 1000);
}

if (!API_URL) showPair('ผู้ดูแล: ยังไม่ได้ใส่ API_URL ในไฟล์ kiosk.html');
else if (load()) startRun(); else showPair();
</script>
</body>
</html>
